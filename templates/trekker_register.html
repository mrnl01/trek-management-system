{% extends "base.html" %}

{% block title %}Trekker Registration{% endblock %}

{% block content %}
<div class="auth-page justify-content-center">
    <div class="card auth-card">
        <div class="text-center mb-4">
            <div class="auth-brand"><i class="bi bi-person-walking"></i></div>
            <h1 class="auth-title">Create Trekker Account</h1>
            <p class="auth-subtitle">Join Trek Manager and start exploring trekking adventures.</p>
        </div>
        <form method="POST" action="{{ url_for('trekker_register') }}">
            <div class="mb-3"><label for="name" class="form-label">Full Name</label><input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required></div>
            <div class="mb-3"><label for="email" class="form-label">Email Address</label><input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required></div>
            <div class="mb-4"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required></div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-person-plus me-1"></i>Create Trekker Account</button>
        </form>
        <div class="text-center mt-4 pt-3 border-top"><p class="small-muted mb-2">Want to register as staff?</p><a href="{{ url_for('staff_register') }}" class="btn btn-outline-primary">Register as Staff</a></div>
        <div class="text-center mt-3"><span class="small-muted">Already have an account?</span> <a href="{{ url_for('login') }}" class="fw-semibold">Login here</a></div>
    </div>
</div>
{% endblock %}
