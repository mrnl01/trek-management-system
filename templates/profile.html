{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="page-header"><div class="eyebrow">Account</div><h1 class="page-title">My Profile</h1><p class="page-subtitle">Keep your account information up to date.</p></div>

<div class="row justify-content-center">
    <div class="col-12 col-lg-9 col-xl-8">
        <div class="card section-card">
            <div class="d-flex align-items-center gap-3 pb-4 mb-4 border-bottom">
                <div class="profile-avatar"><i class="bi bi-person-circle"></i></div>
                <div><h2 class="h5 mb-1">{{ current_user.name }}</h2><span class="role-badge">{{ current_user.role }}</span></div>
            </div>
            <form method="POST">
                <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" id="name" name="name" class="form-control" value="{{ current_user.name }}" required></div>
                <div class="mb-4"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" value="{{ current_user.email }}" required></div>

                {% if current_user.role == "staff" %}
                    <div class="divider-title">Staff Information</div>
                    <div class="row g-3">
                        <div class="col-12 col-md-6"><label for="contact_number" class="form-label">Contact Number</label><input type="text" id="contact_number" name="contact_number" class="form-control" value="{{ staff_profile.contact_number if staff_profile else '' }}" required></div>
                        <div class="col-12 col-md-6"><label for="experience_years" class="form-label">Experience (Years)</label><input type="number" id="experience_years" name="experience_years" class="form-control" min="0" value="{{ staff_profile.experience_years if staff_profile else 0 }}" required></div>
                        <div class="col-12"><label for="specialization" class="form-label">Specialization</label><input type="text" id="specialization" name="specialization" class="form-control" value="{{ staff_profile.specialization if staff_profile else '' }}"></div>
                    </div>
                {% endif %}

                <div class="mt-4 pt-3 border-top"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Update Profile</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
