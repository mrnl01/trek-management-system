{% extends "base.html" %}

{% block title %}Edit Trek{% endblock %}

{% block content %}
<div class="page-header"><div class="eyebrow">Administration</div><h1 class="page-title">Edit Trek</h1><p class="page-subtitle">Update the existing trek information without changing its workflow.</p></div>

<div class="row justify-content-center">
    <div class="col-12 col-lg-9 col-xl-8">
        <div class="card section-card">
            <div class="d-flex align-items-center gap-3 mb-4"><span class="detail-icon"><i class="bi bi-pencil-square"></i></span><div><h2 class="section-title">Trek Information</h2><p class="section-caption">Update the fields below and save your changes.</p></div></div>
            <form method="POST">
                <div class="row g-3">
                    <div class="col-12"><label for="name" class="form-label">Name</label><input type="text" id="name" name="name" class="form-control" value="{{ trek.name or '' }}" placeholder="NAME" required></div>
                    <div class="col-12 col-md-6"><label for="location" class="form-label">Location</label><input type="text" id="location" name="location" class="form-control" value="{{ trek.location or '' }}" placeholder="LOCATION" required></div>
                    <div class="col-12 col-md-6"><label for="difficulty" class="form-label">Difficulty</label><select id="difficulty" name="difficulty" class="form-select" required><option value="">DIFFICULTY</option><option value="Easy" {% if trek.difficulty == "Easy" %}selected{% endif %}>Easy</option><option value="Moderate" {% if trek.difficulty == "Moderate" %}selected{% endif %}>Moderate</option><option value="Hard" {% if trek.difficulty == "Hard" %}selected{% endif %}>Hard</option></select></div>
                    <div class="col-12 col-md-6"><label for="duration" class="form-label">Duration (days)</label><input type="number" id="duration" name="duration" class="form-control" value="{{ trek.duration or '' }}" placeholder="DURATION IN DAYS" min="1" required></div>
                    <div class="col-12 col-md-6"><label for="total_slots" class="form-label">Total Slots</label><input type="number" id="total_slots" name="total_slots" class="form-control" value="{{ trek.total_slots or '' }}" min="1" placeholder="TOTAL SLOTS" required></div>
                    <div class="col-12 col-md-6"><label for="start_date" class="form-label">Start Date</label><input type="date" id="start_date" name="start_date" class="form-control" value="{{ trek.start_date or '' }}" required></div>
                    <div class="col-12 col-md-6"><label for="end_date" class="form-label">End Date</label><input type="date" id="end_date" name="end_date" class="form-control" value="{{ trek.end_date or '' }}" required></div>
                </div>
                <div class="d-flex flex-column flex-sm-row gap-2 mt-4 pt-3 border-top"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Changes</button><a href="{{ url_for('admin_treks') }}" class="btn btn-outline-secondary">Cancel</a></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
