{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page justify-content-center">
    <div class="card auth-card">
        <div class="text-center">
            <div class="auth-brand"><i class="bi bi-signpost-2-fill"></i></div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle mb-4">Sign in to manage your trekking journey.</p>
        </div>

        <form method="POST">
            <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required></div>
            <div class="mb-4"><label for="password" class="form-label">Password</label><input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required></div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top"><span class="small-muted">Don't have an account?</span> <a href="{{ url_for('register') }}" class="fw-semibold">Register here</a></div>
    </div>
</div>
{% endblock %}
