{% extends "base.html" %}

{% block title %}Staff Registration{% endblock %}

{% block content %}
<div class="auth-page justify-content-center">
    <div class="card auth-card">
        <div class="text-center mb-4">
            <div class="auth-brand"><i class="bi bi-person-badge"></i></div>
            <h1 class="auth-title">Staff Registration</h1>
            <p class="auth-subtitle">Submit your details to apply as trek staff.</p>
        </div>
        <form method="POST">
            <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" id="name" name="name" class="form-control" placeholder="Your full name" required></div>
            <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required></div>
            <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required></div>
            <div class="mb-3"><label for="contact_number" class="form-label">Contact Number</label><input type="text" id="contact_number" name="contact_number" class="form-control" placeholder="Enter contact number" required></div>
            <div class="mb-3"><label for="experience_years" class="form-label">Experience (Years)</label><input type="number" id="experience_years" name="experience_years" class="form-control" placeholder="Years of experience" min="0" required></div>
            <div class="mb-4"><label for="specialization" class="form-label">Specialization</label><input type="text" id="specialization" name="specialization" class="form-control" placeholder="e.g. High-altitude trekking" required></div>
            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-send me-1"></i>Register</button>
        </form>
    </div>
</div>
{% endblock %}
